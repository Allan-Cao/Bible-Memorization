[project]
name = "bible-memorization"
version = "0.1.0"
description = "Generate Anki flashcards for Bible memorization using a sliding window with overlapping context"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Allan Cao", email = "allan@allancao.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "genanki",
    "meaningless",
]

[project.scripts]
bible-memorization = "bible_memorization.anki_generator:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]

[tool.coverage.run]
source = ["bible_memorization"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint
]
ignore = [
    "E501",    # line length is handled by the formatter
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "PLR2004", # magic values in comparisons (common in tests)
    "PLC0415", # import outside top-level
    "BLE001",  # broad exception caught (deck generation is intentionally resilient)
]
