[project]
name = "bible-memorization"
version = "0.1.0"
description = "Generate Anki flashcards for Bible memorization using a sliding window with overlapping context"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Allan Cao", email = "allan@allancao.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "genanki",
    "meaningless",
]

[project.scripts]
bible-memorization = "bible_memorization.anki_generator:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]

[tool.coverage.run]
source = ["bible_memorization"]
branch = true

[tool.coverage.report]
show_missing = true